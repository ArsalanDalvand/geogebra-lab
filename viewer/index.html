<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>geobsidian GeoGebra Viewer</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    #ggb-element {
      width: 100%;
      height: 100%;
    }

    .status {
      box-sizing: border-box;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      color: #444;
      font: 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }

    .status.error {
      color: #a61b1b;
    }
  </style>
</head>
<body>
  <div id="ggb-element">
    <div class="status">Loading GeoGebra...</div>
  </div>

  <script>
    (function () {
      "use strict";

      var payload = readPayload();
      var blockId = payload && typeof payload.blockId === "string" ? payload.blockId : "";

      if (!payload) {
        showError("Missing or invalid geobsidian viewer payload.");
        reportError("Missing or invalid geobsidian viewer payload.");
        return;
      }

      var config = normalizeConfig(payload.config || {});
      var geogebraScriptUrl = sanitizeHttpUrl(
        payload.geogebraScriptUrl,
        "https://www.geogebra.org/apps/deployggb.js"
      );

      loadGeoGebra(geogebraScriptUrl, function () {
        injectApplet(config);
      });

      function readPayload() {
        try {
          var raw = window.location.hash ? window.location.hash.slice(1) : "";
          if (!raw) {
            return undefined;
          }
          return JSON.parse(decodeURIComponent(raw));
        } catch (error) {
          return undefined;
        }
      }

      function normalizeConfig(input) {
        var appName = ["graphing", "geometry", "3d", "classic"].indexOf(input.appName) >= 0
          ? input.appName
          : "graphing";

        return {
          appName: appName,
          width: positiveInteger(input.width, Math.max(1, window.innerWidth || 800)),
          height: positiveInteger(input.height, Math.max(1, window.innerHeight || 500)),
          showToolBar: input.showToolBar === true,
          showAlgebraInput: input.showAlgebraInput !== false,
          showMenuBar: input.showMenuBar === true,
          materialId: typeof input.materialId === "string" ? input.materialId : undefined,
          filename: typeof input.filename === "string" ? input.filename : undefined,
          commands: Array.isArray(input.commands)
            ? input.commands.filter(function (command) { return typeof command === "string"; })
            : []
        };
      }

      function positiveInteger(value, fallback) {
        var numberValue = Number(value);
        if (Number.isFinite(numberValue) && numberValue > 0) {
          return Math.round(numberValue);
        }
        return fallback;
      }

      function sanitizeHttpUrl(value, fallback) {
        try {
          var url = new URL(String(value));
          if (url.protocol === "https:" || url.protocol === "http:") {
            return url.toString();
          }
        } catch (error) {
          return fallback;
        }
        return fallback;
      }

      function loadGeoGebra(scriptUrl, onload) {
        var script = document.createElement("script");
        script.src = scriptUrl;
        script.async = true;
        script.onload = onload;
        script.onerror = function () {
          var message = "GeoGebra script failed to load: " + scriptUrl;
          showError(message);
          reportError(message);
        };
        document.head.appendChild(script);
      }

      function injectApplet(config) {
        if (typeof window.GGBApplet !== "function") {
          showError("GeoGebra script loaded, but GGBApplet was not available.");
          reportError("GeoGebra script loaded, but GGBApplet was not available.");
          return;
        }

        var params = {
          id: blockId + "-applet",
          appName: config.appName,
          width: Math.max(1, Math.floor(window.innerWidth || config.width)),
          height: Math.max(1, Math.floor(window.innerHeight || config.height)),
          showToolBar: config.showToolBar,
          showAlgebraInput: config.showAlgebraInput,
          showMenuBar: config.showMenuBar,
          appletOnLoad: function (api) {
            runCommands(api, config.commands);
          }
        };

        if (config.materialId) {
          params.material_id = config.materialId;
        }

        if (config.filename) {
          params.filename = config.filename;
        }

        try {
          var applet = new window.GGBApplet(params, true);
          applet.inject("ggb-element");
        } catch (error) {
          var message = "GeoGebra applet failed to initialize: " + errorMessage(error);
          showError(message);
          reportError(message);
        }
      }

      function runCommands(api, commands) {
        commands.forEach(function (command) {
          try {
            var result = api.evalCommand(command);
            if (result === false) {
              reportError("GeoGebra command failed: " + command);
            }
          } catch (error) {
            reportError("GeoGebra command error for " + command + ": " + errorMessage(error));
          }
        });
      }

      function showError(message) {
        var element = document.getElementById("ggb-element");
        if (!element) {
          return;
        }
        element.innerHTML = "";
        var status = document.createElement("div");
        status.className = "status error";
        status.textContent = message;
        element.appendChild(status);
      }

      function reportError(message) {
        console.error("[geobsidian viewer]", message);
        window.parent.postMessage({
          source: "geobsidian",
          blockId: blockId,
          type: "error",
          message: message
        }, "*");
      }

      function errorMessage(error) {
        return error && error.message ? error.message : String(error);
      }
    })();
  </script>
</body>
</html>
