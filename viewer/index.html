<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GeoGebra Lab Viewer</title>
  <style>
    @font-face {
      font-family: "geogebra-sans-serif";
      src: local("Inter"),
           local("Segoe UI"),
           local("Roboto"),
           local("-apple-system"),
           local("BlinkMacSystemFont"),
           local("Helvetica Neue"),
           local("Arial"),
           local("Vazirmatn"),
           local("sans-serif");
      font-display: swap;
    }

    @font-face {
      font-family: "Arial Unicode MS";
      src: local("Inter"),
           local("Segoe UI"),
           local("Roboto"),
           local("-apple-system"),
           local("BlinkMacSystemFont"),
           local("Helvetica Neue"),
           local("Arial"),
           local("Vazirmatn"),
           local("sans-serif");
      font-display: swap;
    }

    :root {
      --ggb-font-stack: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, Inter, "Vazirmatn", sans-serif;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: transparent;
      font-family: var(--ggb-font-stack);
    }

    #ggb-element,
    .GeoGebraFrame,
    .KeyBoard,
    .KeyBoardButton,
    .gwt-PopupPanel {
      font-family: var(--ggb-font-stack) !important;
    }

    .KeyBoardButton.greek {
      font-family: "greek", var(--ggb-font-stack) !important;
    }

    #ggb-element {
      width: 100%;
      height: 100%;
      box-sizing: border-box;
    }

    .status {
      box-sizing: border-box;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      color: #777;
      font: 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }

    .status.error {
      color: #a61b1b;
    }
  </style>
</head>
<body>
  <div id="ggb-element">
    <div id="loading-status" class="status">Loading GeoGebra...</div>
  </div>

  <script>
    (function () {
      "use strict";

      var payload = readPayload();
      var blockId = payload && typeof payload.blockId === "string" ? payload.blockId : "";

      if (!payload) {
        showError("Missing or invalid GeoGebra Lab viewer payload.");
        reportError("Missing or invalid GeoGebra Lab viewer payload.");
        return;
      }

      var config = payload.config || {};
      var loadingEl = document.getElementById("loading-status");
      if (loadingEl && config.loadingText) {
        loadingEl.textContent = config.loadingText;
      }

      if (config.borderRadius) {
        document.getElementById("ggb-element").style.borderRadius = config.borderRadius + "px";
        document.getElementById("ggb-element").style.overflow = "hidden";
      }
      if (config.borderColor) {
        document.getElementById("ggb-element").style.border = "1px solid " + config.borderColor;
      }

      window.__geogebraLabViewerInjectApplet = function () {
        injectApplet(config);
      };

      function readPayload() {
        try {
          var raw = window.location.hash ? window.location.hash.slice(1) : "";
          if (!raw) {
            return undefined;
          }
          return JSON.parse(decodeURIComponent(raw));
        } catch (error) {
          return undefined;
        }
      }

      function injectApplet(cfg) {
        if (typeof window.GGBApplet !== "function") {
          showError("GeoGebra script loaded, but GGBApplet was not available.");
          reportError("GeoGebra script loaded, but GGBApplet was not available.");
          return;
        }

        var params = Object.assign({}, cfg);
        delete params.commands;
        delete params.caption;
        delete params.explain;
        delete params.loadingText;

        params.id = blockId + "-applet";
        params.appName = cfg.appName || "graphing";

        if (!cfg.scaleContainerClass) {
          params.width = Math.max(1, Math.floor(window.innerWidth || cfg.width || 800));
          params.height = Math.max(1, Math.floor(window.innerHeight || cfg.height || 500));
        }

        if (cfg.materialId) {
          params.material_id = cfg.materialId;
        }

        var targetLanguage =
          cfg.language && typeof cfg.language === "string" && cfg.language.trim()
            ? cfg.language.trim()
            : "en";
        params.language = targetLanguage;
        if (document.documentElement) {
          document.documentElement.lang = targetLanguage;
        }

        params.appletOnLoad = function (api) {
          if (typeof api.setLanguage === "function" && targetLanguage) {
            try {
              api.setLanguage(targetLanguage);
            } catch (e) {
              console.warn("[geogebra-lab viewer] Failed to force language via api.setLanguage:", e);
            }
          }
          runCommands(api, cfg.commands || []);
        };

        try {
          var applet = new window.GGBApplet(params, true);
          applet.inject("ggb-element");
        } catch (error) {
          var message = "GeoGebra applet failed to initialize: " + errorMessage(error);
          showError(message);
          reportError(message);
        }
      }

      function runCommands(api, commands) {
        commands.forEach(function (command) {
          try {
            var result = api.evalCommand(command);
            if (result === false) {
              reportError("GeoGebra command failed: " + command);
            }
          } catch (error) {
            reportError("GeoGebra command error for " + command + ": " + errorMessage(error));
          }
        });
      }

      function showError(message) {
        var element = document.getElementById("ggb-element");
        if (!element) {
          return;
        }
        element.innerHTML = "";
        var status = document.createElement("div");
        status.className = "status error";
        status.textContent = message;
        element.appendChild(status);
      }

      function reportError(message) {
        console.error("[geogebra-lab viewer]", message);
        window.parent.postMessage({
          source: "geogebra-lab",
          blockId: blockId,
          type: "error",
          message: message
        }, "*");
      }

      function errorMessage(error) {
        return error && error.message ? error.message : String(error);
      }

      var scriptUrl = (payload && payload.geogebraScriptUrl) || "https://www.geogebra.org/apps/deployggb.js";
      var scriptTag = document.createElement("script");
      scriptTag.src = scriptUrl;
      scriptTag.onload = function () {
        if (typeof window.__geogebraLabViewerInjectApplet === "function") {
          window.__geogebraLabViewerInjectApplet();
        }
      };
      scriptTag.onerror = function () {
        showError("Failed to load GeoGebra deployment script from: " + scriptUrl);
        reportError("Failed to load GeoGebra deployment script from: " + scriptUrl);
      };
      document.body.appendChild(scriptTag);
    })();
  </script>
</body>
</html>
